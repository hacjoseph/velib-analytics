# Versioned on purpose: DuckDB is a local file, there is no secret here.
velib_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../data/warehouse/velib.duckdb') }}"
      schema: main
      threads: 2
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '8GB') }}"
        threads: 2
        preserve_insertion_order: false 