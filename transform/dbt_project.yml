name: velib_analytics
version: "0.1.0"
config-version: 2
profile: velib_analytics

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]
vars:
  atypical_station_capacity_threshold: 150
  dim_time_start_date: "2026-01-01"
  dim_time_end_date: "2028-01-01"

models:
  velib_analytics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table