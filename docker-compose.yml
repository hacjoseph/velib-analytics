services:
  object-storage:
    image: rustfs/rustfs:1.0.0-alpha.83
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?missing in .env}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?missing in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-storage-data:/data
    restart: unless-stopped

  ingestion:
    build: .
    image: velib-ingestion
    depends_on:
      - object-storage
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://object-storage:9000
      S3_BUCKET: velib-raw
      S3_CREATE_BUCKET: "true"
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY}
    profiles: ["jobs"]

volumes:
  object-storage-data: