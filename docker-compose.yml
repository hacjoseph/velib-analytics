x-ingestion-environment: &ingestion-environment
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://object-storage:9000
  S3_BUCKET: velib-raw
  S3_CREATE_BUCKET: "true"
  AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: orchestration/Dockerfile
  image: velib-analytics/airflow:3.3.1
  profiles: ["orchestration"]
  user: "${AIRFLOW_UID:?AIRFLOW_UID must be set in .env}:0"
  environment: &airflow-common-env
    <<: *ingestion-environment
    OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?missing}
    OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?missing}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?missing}@airflow-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?missing}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?missing}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?missing}
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    DBT_PROFILES_DIR: /opt/velib/transform
    DBT_DUCKDB_PATH: /opt/velib/data/warehouse/velib.duckdb
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./orchestration/logs:/opt/airflow/logs
    - ./orchestration/plugins:/opt/airflow/plugins
    - ./orchestration/config:/opt/airflow/config
    - ./transform:/opt/velib/transform
    - ./data/warehouse:/opt/velib/data/warehouse
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  object-storage:
    image: rustfs/rustfs:1.0.0-alpha.83
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?missing in .env}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?missing in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-storage-data:/data
    restart: unless-stopped

  # One-off run: docker compose run --rm ingestion [source ...]
  ingestion:
    build: .
    image: velib-ingestion
    depends_on:
      - object-storage
    environment: *ingestion-environment
    profiles: ["jobs"]

  # TEMPORARY: runs the ingestion every INTERVAL_SECONDS until Airflow replaces it.
  # ingestion-scheduler:
  #   build: .
  #   image: velib-ingestion
  #   depends_on:
  #     - object-storage
  #   environment:
  #     <<: *ingestion-environment
  #     INTERVAL_SECONDS: "1800" # 30 minutes
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - |
  #       while true; do
  #         python -m ingestion.main || echo "Run failed, will retry at next tick"
  #         sleep "$$INTERVAL_SECONDS"
  #       done
  #   restart: unless-stopped


  # Airflow sevices
  airflow-postgres:
    image: postgres:17-alpine
    profiles: ["orchestration"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?missing}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?missing}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?missing}
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  object-storage-data:
  airflow-postgres-data: